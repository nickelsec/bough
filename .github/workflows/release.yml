# Builds the binaries a tag stands for and attaches them to its release.
#
# go install covers people who already have Go. This covers everyone else,
# which for a tool aimed at Claude Code users is most of them.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="bough"
          if [ "$GOOS" = "windows" ]; then name="bough.exe"; fi
          # -s -w drop the symbol table and DWARF, which is about a third of
          # the file and nothing a user of a released build needs.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$name" ./cmd/bough

          dir="bough_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "$dir"
          mv "$name" "$dir"/
          cp README.md LICENSE "$dir"/

          if [ "$GOOS" = "windows" ]; then
            zip -qr "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bough_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One file listing every archive's hash, so a download can be checked.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
