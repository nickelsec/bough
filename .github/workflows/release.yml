# Builds the binaries a tag stands for and attaches them to its release.
#
# go install covers people who already have Go. This covers everyone else,
# which for a tool aimed at Claude Code users is most of them.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="bough"
          if [ "$GOOS" = "windows" ]; then name="bough.exe"; fi
          # -s -w drop the symbol table and DWARF, which is about a third of
          # the file and nothing a user of a released build needs.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$name" ./cmd/bough

          dir="bough_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "$dir"
          mv "$name" "$dir"/
          cp README.md LICENSE "$dir"/

          if [ "$GOOS" = "windows" ]; then
            zip -qr "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bough_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One file listing every archive's hash, so a download can be checked.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Rewrites the Homebrew formula to point at the release just published.
  #
  # Generated rather than edited, because a formula that still names the
  # previous version installs the previous version and says nothing about it.
  # Nobody notices until somebody reports a bug that was fixed two releases ago.
  #
  # Needs TAP_TOKEN: a token with contents write on the tap repository. The
  # default GITHUB_TOKEN is scoped to this one and cannot reach another.
  brew:
    needs: publish
    runs-on: ubuntu-latest
    # The release is already out by this point. A tap that failed to update is
    # worth a red mark to come back to, not a release that looks like it broke.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: checksums

      - uses: actions/checkout@v7
        with:
          repository: nickelsec/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write the formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sum() { grep " bough_${TAG}_$1\.tar\.gz\$" checksums.txt | cut -d' ' -f1; }

          mkdir -p tap/Formula
          cat > tap/Formula/bough.rb <<RUBY
          # Generated by the release workflow in nickelsec/bough. Do not edit:
          # the next release overwrites it.
          class Bough < Formula
            desc "Draw what you built with Claude Code and Codex, and what it cost"
            homepage "https://www.bough.run"
            version "${TAG#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/nickelsec/bough/releases/download/${TAG}/bough_${TAG}_darwin_arm64.tar.gz"
                sha256 "$(sum darwin_arm64)"
              end
              on_intel do
                url "https://github.com/nickelsec/bough/releases/download/${TAG}/bough_${TAG}_darwin_amd64.tar.gz"
                sha256 "$(sum darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/nickelsec/bough/releases/download/${TAG}/bough_${TAG}_linux_arm64.tar.gz"
                sha256 "$(sum linux_arm64)"
              end
              on_intel do
                url "https://github.com/nickelsec/bough/releases/download/${TAG}/bough_${TAG}_linux_amd64.tar.gz"
                sha256 "$(sum linux_amd64)"
              end
            end

            # Homebrew strips the archive's single top directory before this
            # runs, so the binary is at the root by the time we get here.
            def install
              bin.install "bough"
              doc.install "README.md", "LICENSE"
            end

            test do
              assert_match "${TAG#v}", shell_output("#{bin}/bough --version")
            end
          end
          RUBY

          # An empty hash would produce a formula that fails for one
          # architecture only, which is the kind of break that gets found by a
          # user rather than by this workflow.
          grep -c 'sha256 ""' tap/Formula/bough.rb && exit 1 || true
          cat tap/Formula/bough.rb

      - name: Push it
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bough.rb
          git diff --staged --quiet || git commit -m "bough ${TAG}"
          git push
