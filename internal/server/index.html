<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · bough</title>
<link rel="icon" href="/img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<style>{{.Fonts}}</style>
<style>{{.CSS}}</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>
  <div id="tree"></div>
</div>

<div class="mark">
  <img src="/img/logo.png" alt="bough" width="96" height="38">
  <div class="mark-who">
    <h1 id="name"></h1>
    <p class="where" id="where"></p>
  </div>
</div>

<nav class="rail" aria-label="Filters">
  <div class="rail-tabs" role="tablist" aria-label="What to filter by">
    <button type="button" class="rail-btn" role="tab" data-panel="file"
            aria-selected="false" aria-controls="p-file" title="Find a file">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
      <span class="dot" hidden></span>
    </button>
    <button type="button" class="rail-btn" role="tab" data-panel="when"
            aria-selected="false" aria-controls="p-when" title="Narrow the dates">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/></svg>
      <span class="dot" hidden></span>
    </button>
    <button type="button" class="rail-btn" role="tab" data-panel="show"
            aria-selected="false" aria-controls="p-show" title="What to show">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M5 10h10M8 14h4"/></svg>
      <span class="dot" hidden></span>
    </button>
  </div>

  <!-- One card, whose contents change with the tab. Three panels floating in
       slightly different places made the rail feel unsettled. -->
  <div class="rail-card" id="rail-card" hidden>
    <div class="rail-body" id="p-file" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Find a file</h2>
        <button type="button" class="rail-reset" id="f-file-clear" hidden>Clear</button>
      </div>
      <div class="field">
        <input type="search" id="f-file" placeholder="hero.css" autocomplete="off">
      </div>
      <p class="rail-note">Lights the work that touched it, as you type.</p>
    </div>

    <div class="rail-body" id="p-when" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Narrow the dates</h2>
        <button type="button" class="rail-reset" id="f-when-clear" hidden>Clear</button>
      </div>
      <div class="field">
        <label for="f-from">From</label>
        <input type="date" id="f-from">
      </div>
      <div class="field">
        <label for="f-to">To</label>
        <input type="date" id="f-to">
      </div>
      <div class="rail-actions">
        <button type="button" id="f-when-go" class="solid">Apply</button>
      </div>
    </div>

    <div class="rail-body" id="p-show" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>What to show</h2>
        <button type="button" class="rail-reset" id="f-show-clear" hidden>Clear</button>
      </div>

      <button type="button" class="switch" id="f-size" role="switch" aria-checked="false">
        <span class="switch-text">
          Only substantial sittings
          <small>Fades anything under five prompts.</small>
        </span>
        <span class="track"><span class="knob"></span></span>
      </button>

      <button type="button" class="switch" id="f-hard" role="switch" aria-checked="false">
        <span class="switch-text">
          Show where it was hard
          <small>From how often a file was rewritten and how densely the
          prompts came. <em>Not checked against anyone's memory yet.</em></small>
        </span>
        <span class="track"><span class="knob"></span></span>
      </button>
    </div>

  </div>
</nav>

<div id="pop" role="status" hidden></div>

<aside id="reader" aria-label="What happened here">
  <button type="button" id="reader-close" aria-label="Close">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
    <span>Back</span>
  </button>
  <div id="reader-body"></div>
</aside>

<div class="foot" id="foot">
  <!-- The whole line is the control, not just the chevron. A row of figures
       with a chevron on the end reads as one thing, so it should behave as
       one, and it is a far easier target than a mark the size of a word. A
       button element rather than a div with a handler, so it is reachable by
       keyboard and announces itself without any of that being rebuilt here. -->
  <button type="button" class="foot-line" id="foot-more"
          aria-expanded="false" aria-controls="foot-rest">
    <span class="foot-row" id="foot-main"></span>
    <span class="foot-chevron" aria-hidden="true">
      <svg viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></svg>
    </span>
  </button>
  <div class="foot-row foot-rest" id="foot-rest" hidden></div>
</div>

<div class="zoom" role="group" aria-label="Zoom">
  <button type="button" id="z-out" class="zoom-btn" aria-label="Zoom out">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
  </button>
  <button type="button" id="z-reset" class="zoom-level" aria-label="Back to the opening view">
    <span id="z-now">100%</span>
  </button>
  <button type="button" id="z-in" class="zoom-btn" aria-label="Zoom in">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10"/></svg>
  </button>
  <!-- Only shown when the history is longer than one screen at a size the
       nodes can be read at. On a short project it would do nothing, since the
       opening view is already the whole thing. -->
  <button type="button" id="z-all" class="zoom-btn zoom-all"
          aria-label="Show every day at once" aria-pressed="false" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M7.5 3.5H4.5a1 1 0 00-1 1v3M12.5 3.5h3a1 1 0 011 1v3M7.5 16.5H4.5a1 1 0 01-1-1v-3M12.5 16.5h3a1 1 0 001-1v-3"/>
    </svg>
  </button>
</div>

<div class="empty">
  <img src="/img/logo.png" alt="bough" width="200">
  <p id="empty-note">Nothing matches those filters.</p>
</div>

<script>window.BOUGH = {{.Graph}};</script>
<script>{{.Layout}}</script>
<script>{{.JS}}</script>
</body>
</html>
