<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · bough</title>
<link rel="icon" href="/img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<style>{{.Fonts}}</style>
<style>{{.CSS}}</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>
  <div id="tree"></div>
</div>

<div class="mark">
  <img src="/img/logo.png" alt="bough" width="96" height="38">
  <div class="mark-who">
    <div class="mark-title">
      <h1 id="name"></h1>
      <!-- Which agent wrote this history. Filled in for every agent rather
           than only the unfamiliar one: naming just the newcomer implies the
           other is the default, which stopped being true at the second. -->
      <span class="mark-agent" id="agent" hidden></span>
    </div>
    <p class="where" id="where"></p>
  </div>
</div>

<nav class="rail" aria-label="Filters">
  <!-- The strip. It holds the tablist and, under a rule, the one button that
       is not a filter, so the two groups are one column of controls without
       the button pretending to be a fifth tab. -->
  <div class="rail-strip">
    <div class="rail-tabs" role="tablist" aria-label="What to filter by">
    <button type="button" class="rail-btn" role="tab" data-panel="said"
            aria-selected="false" aria-controls="p-said" title="Search your prompts">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
      <span class="dot" hidden></span>
    </button>
    <!-- The magnifier belongs to the prompt search, since that is the one
         people mean by searching. A file is looked up rather than searched for,
         so it gets a page with a folded corner. -->
    <button type="button" class="rail-btn" role="tab" data-panel="file"
            aria-selected="false" aria-controls="p-file" title="Find a file">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.5 2.5H6a1.5 1.5 0 00-1.5 1.5v12A1.5 1.5 0 006 17.5h8a1.5 1.5 0 001.5-1.5V6.5zM11.5 2.5v4h4"/></svg>
      <span class="dot" hidden></span>
    </button>
    <button type="button" class="rail-btn" role="tab" data-panel="when"
            aria-selected="false" aria-controls="p-when" title="Narrow the dates">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/></svg>
      <span class="dot" hidden></span>
    </button>
    <!-- Narrowing by what the work cost. A tag, the shape a price hangs off
         nearly everywhere, rather than a currency symbol: the filter covers
         tokens as well as dollars, and a project with no published rate for
         its model can still use the token half. Hidden until the history has
         figures to filter on, the way the usage button is. -->
    <button type="button" class="rail-btn" role="tab" data-panel="cost"
            aria-selected="false" aria-controls="p-cost" title="Spend threshold" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10.6 2.6H16a1.4 1.4 0 011.4 1.4v5.4a1.4 1.4 0 01-.41.99l-6.6 6.6a1.4 1.4 0 01-1.98 0l-5.4-5.4a1.4 1.4 0 010-1.98l6.6-6.6a1.4 1.4 0 01.99-.41z"/><circle cx="13.4" cy="6.6" r="1.15"/></svg>
      <span class="dot" hidden></span>
    </button>
    <button type="button" class="rail-btn" role="tab" data-panel="show"
            aria-selected="false" aria-controls="p-show" title="What to show">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M5 10h10M8 14h4"/></svg>
      <span class="dot" hidden></span>
    </button>
    </div>

    <!-- In the strip with the filters but outside their tablist, because it
         is not one of them: those four narrow what is drawn and this narrows
         nothing. It opens a reading of the same work, so it is a button that
         opens a dialog, divided off by a rule so the grouping is visible and
         not only in the markup.

         Stacked coins, which is what a count of something spent looks like
         nearly everywhere. -->
    <button type="button" class="rail-btn rail-aside" id="rail-spend"
            aria-haspopup="dialog" title="Token usage" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <ellipse cx="10" cy="5.6" rx="5.8" ry="2.3"/>
        <path d="M4.2 5.6v3c0 1.27 2.6 2.3 5.8 2.3s5.8-1.03 5.8-2.3v-3"/>
        <path d="M4.2 9.4v3c0 1.27 2.6 2.3 5.8 2.3s5.8-1.03 5.8-2.3v-3"/>
      </svg>
    </button>
  </div>

  <!-- One card, whose contents change with the tab. Separate panels floating
       in slightly different places made the rail feel unsettled. -->
  <div class="rail-card" id="rail-card" hidden>
    <div class="rail-body" id="p-said" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Search your prompts</h2>
        <button type="button" class="rail-reset" id="f-said-clear" hidden>Clear</button>
      </div>
      <div class="field">
        <input type="search" id="f-said" placeholder="timezone parser" autocomplete="off">
      </div>
      <!-- Every word has to appear, in any order. Nobody remembers the exact
           sentence they typed three weeks ago, they remember two words of it.
           The note carries the count once a search is running, since rings
           scattered across a wide history can all be off the side of the
           screen. -->
      <p class="rail-note" id="f-said-note">Rings every prompt holding all of those words.</p>
    </div>

    <div class="rail-body" id="p-file" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Find a file</h2>
        <button type="button" class="rail-reset" id="f-file-clear" hidden>Clear</button>
      </div>
      <div class="field">
        <input type="search" id="f-file" placeholder="hero.css" autocomplete="off">
      </div>
      <p class="rail-note">Lights the work that touched it, as you type.</p>
    </div>

    <div class="rail-body" id="p-when" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Narrow the dates</h2>
        <button type="button" class="rail-reset" id="f-when-clear" hidden>Clear</button>
      </div>
      <div class="field">
        <label for="f-from">From</label>
        <input type="date" id="f-from">
      </div>
      <div class="field">
        <label for="f-to">To</label>
        <input type="date" id="f-to">
      </div>
      <div class="rail-actions">
        <button type="button" id="f-when-go" class="solid">Apply</button>
      </div>
    </div>

    <!-- One slider over whichever measure is chosen, rather than a slider per
         figure. Six tracks stacked up would mostly move together, since cache
         reads are around 99% of every token count, and the reader is after
         one figure at a time in any case. So the measure is a row of buttons
         and the slider under it always means the same thing: show me the work
         at or above this.

         A minimum rather than a range. "What did I spend more than $25 on" is
         the question people arrive with. An upper bound answers nothing
         anybody asked and doubles the controls. -->
    <div class="rail-body" id="p-cost" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>Spend threshold</h2>
        <button type="button" class="rail-reset" id="f-cost-clear" hidden>Clear</button>
      </div>

      <div class="field">
        <label for="f-spend">At least</label>
        <output class="slide-now" id="f-spend-now">nothing</output>
        <input type="range" id="f-spend" min="0" max="1000" value="0" step="1"
               aria-describedby="f-spend-note">
      </div>

      <!-- Which measure the slider reads. Money first, since it is the one
           people came for; the token counts follow in the order the usage
           table prints them, and under the same names, so the column someone
           has just read is the button they reach for.

           All five counts rather than a chosen two. They move almost together
           on most work, which was the argument for picking a couple, but that
           is a fact about the histories measured so far and not a rule, and
           the reader of this page is the one who knows which figure they are
           chasing. The token half also carries a project whose model has no
           published rate, where the cost button is the one that cannot
           work. -->
      <div class="pick" id="f-measure" role="group" aria-label="Measure by">
        <button type="button" class="pick-btn" data-by="cost" aria-pressed="true">Cost</button>
        <button type="button" class="pick-btn" data-by="output" aria-pressed="false">Output</button>
        <button type="button" class="pick-btn" data-by="input" aria-pressed="false">Input</button>
        <button type="button" class="pick-btn" data-by="cacheWrite" aria-pressed="false">Cache write</button>
        <button type="button" class="pick-btn" data-by="cacheRead" aria-pressed="false">Cache read</button>
        <button type="button" class="pick-btn" data-by="total" aria-pressed="false">Total</button>
      </div>

      <p class="rail-note" id="f-spend-note">Fades work below the threshold.</p>
    </div>

    <div class="rail-body" id="p-show" role="tabpanel" hidden>
      <div class="rail-head">
        <button type="button" class="rail-back" aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
        </button>
        <h2>What to show</h2>
        <button type="button" class="rail-reset" id="f-show-clear" hidden>Clear</button>
      </div>

      <button type="button" class="switch" id="f-size" role="switch" aria-checked="false">
        <span class="switch-text">
          Only substantial sittings
          <small>Fades anything under five prompts.</small>
        </span>
        <span class="track"><span class="knob"></span></span>
      </button>

      <button type="button" class="switch" id="f-hard" role="switch" aria-checked="false">
        <span class="switch-text">
          Show where it was hard
          <small>From how often a file was rewritten and how densely the
          prompts came. <em>Not checked against anyone's memory yet.</em></small>
        </span>
        <span class="track"><span class="knob"></span></span>
      </button>
    </div>

  </div>
</nav>

<div id="pop" role="status" hidden></div>

<aside id="reader" aria-label="What happened here">
  <button type="button" id="reader-close" aria-label="Close">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
    <span>Back</span>
  </button>
  <div id="reader-body"></div>
</aside>

<div class="foot" id="foot">
  <!-- The whole line is the control, not just the chevron. A row of figures
       with a chevron on the end reads as one thing, so it should behave as
       one, and it is a far easier target than a mark the size of a word. A
       button element rather than a div with a handler, so it is reachable by
       keyboard and announces itself without any of that being rebuilt here. -->
  <button type="button" class="foot-line" id="foot-more"
          aria-expanded="false" aria-controls="foot-rest">
    <span class="foot-row" id="foot-main"></span>
    <span class="foot-chevron" aria-hidden="true">
      <svg viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></svg>
    </span>
  </button>
  <div class="foot-row foot-rest" id="foot-rest" hidden></div>
</div>

<!-- The whole breakdown, for anyone who wants the figures rather than the
     shape. Kept off the drawing: it is a table, and a table on top of a
     diagram is two things competing for the same attention. -->
<div id="spend" class="spend" role="dialog" aria-modal="true"
     aria-labelledby="spend-title" hidden>
  <div class="spend-card">
    <div class="spend-head">
      <h2 id="spend-title">Token usage</h2>
      <button type="button" id="spend-close" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <!-- A row scrolling out passes behind the column names and has to be
         gone before it reaches them. The names are sticky inside the table,
         and anything in the table can paint over a shadow they cast, so the
         cover sits here instead, outside it, where nothing can. -->
    <div class="spend-scroll">
      <div class="spend-cover" aria-hidden="true"></div>
      <div class="spend-body" id="spend-body"></div>
    </div>
  </div>
</div>

<div class="zoom" role="group" aria-label="Zoom">
  <button type="button" id="z-out" class="zoom-btn" aria-label="Zoom out">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
  </button>
  <button type="button" id="z-reset" class="zoom-level" aria-label="Back to the opening view">
    <span id="z-now">100%</span>
  </button>
  <button type="button" id="z-in" class="zoom-btn" aria-label="Zoom in">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10"/></svg>
  </button>
  <!-- Only shown when the history is longer than one screen at a size the
       nodes can be read at. On a short project it would do nothing, since the
       opening view is already the whole thing. -->
  <button type="button" id="z-all" class="zoom-btn zoom-all"
          aria-label="Show every day at once" aria-pressed="false" hidden>
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M7.5 3.5H4.5a1 1 0 00-1 1v3M12.5 3.5h3a1 1 0 011 1v3M7.5 16.5H4.5a1 1 0 01-1-1v-3M12.5 16.5h3a1 1 0 001-1v-3"/>
    </svg>
  </button>
</div>

<div class="empty">
  <img src="/img/logo.png" alt="bough" width="200">
  <p id="empty-note">Nothing matches those filters.</p>
</div>

<script>window.BOUGH = {{.Graph}};</script>
<script>{{.Layout}}</script>
<script>{{.JS}}</script>
</body>
</html>
